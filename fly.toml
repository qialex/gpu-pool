app = "gpu-pool"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "node dist/web.js"
  worker = "node dist/worker.js"

# A slow rent pass must not be killed, and a sleeping machine must not skip health checks.
[[restart]]
  policy = "always"
  processes = ["web", "worker"]

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["worker"]
